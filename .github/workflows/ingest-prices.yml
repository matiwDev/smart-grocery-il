name: Ingest prices

# Daily automated run of scripts/ingest-prices.ts (see CLAUDE.md "Price
# ingestion pipeline"). GitHub already emails the repo owner/watchers on a
# failed scheduled run by default (Settings > Notifications > Actions) — no
# extra notification step needed as long as that setting is left on.
on:
  schedule:
    # 03:00 UTC = ~05:00/06:00 Israel time (IDT is UTC+3 in summer), safely
    # off-peak for both the site and the upstream chain feeds.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ingest

      - name: Print ingest_log summary
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/ingest_log?select=chain_id,started_at,finished_at,products_fetched,products_matched,products_inserted,error_text&order=started_at.desc&limit=7" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | python3 -m json.tool

      # Phase 11 step 5: one-line run summary across every chain runIngestion()
      # covers (shufersal/rami_levy/victory/mahsanei_hashuk/yohananof/osher_ad/
      # keshet_teamim) — new chains are picked up automatically as long as
      # runIngestion() (scripts/ingest-prices.ts) grows to cover them, no
      # workflow change needed beyond this summary step.
      - name: Print run summary
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
            const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            const headers = { apikey: key, Authorization: `Bearer ${key}` };
            (async () => {
              const logRes = await fetch(
                `${url}/rest/v1/ingest_log?select=chain_id,products_inserted,error_text&order=started_at.desc&limit=7`,
                { headers }
              );
              const rows = await logRes.json();
              const chainsIngested = rows.filter((r) => !r.error_text).length;
              const newPrices = rows.reduce((sum, r) => sum + (r.products_inserted || 0), 0);

              const countRes = await fetch(`${url}/rest/v1/products?select=id`, {
                method: "HEAD",
                headers: { ...headers, Prefer: "count=exact" },
              });
              const totalProducts = Number(countRes.headers.get("content-range")?.split("/")[1] ?? "unknown");

              console.log(`Chains ingested: ${chainsIngested}, Total products: ${totalProducts}, New prices: ${newPrices}`);
            })();
          '
